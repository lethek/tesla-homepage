{{define "body"}}
<main class="card">
  <h1>Sign in</h1>
  {{template "messages" .}}
  <form method="post" action="/login">
    <label>Username <input name="username" value="{{.Form}}" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Sign in</button>
  </form>
</main>
{{end}}
