{{define "body"}}
<main class="card">
  <h1>Create the admin account</h1>
  <p>This is a new install. The account you create here can add other users.</p>
  {{template "messages" .}}
  <form method="post" action="/setup">
    <label>Username <input name="username" value="{{.Form}}" maxlength="32" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Confirm password <input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
    <button type="submit" class="primary">Create account</button>
  </form>
</main>
{{end}}
